apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: resilience-playground/loadgen:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URL
              value: http://target/api/work
            - name: RATE
              value: "10"
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
