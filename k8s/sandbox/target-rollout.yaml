apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: target
  namespace: sandbox
spec:
  replicas: 3
  revisionHistoryLimit: 2
  # A release whose new pods are not ready within 30s is aborted, and the
  # Rollout goes back to the stable version on its own. Timed pauses in the
  # steps below do not count towards the deadline.
  progressDeadlineSeconds: 30
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: target
  strategy:
    canary:
      # Never drop below 3 serving pods: the canary is added on top, and an old
      # pod is only removed once the canary is ready.
      maxSurge: 1
      maxUnavailable: 0
      steps:
        # One canary pod out of three. This step only completes once the canary
        # is ready, so a canary that never becomes ready stops the release here
        # and receives no traffic.
        - setWeight: 33
        - pause:
            duration: 20s
  template:
    metadata:
      labels:
        app: target
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: target
          image: resilience-playground/target:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Holds off the other two probes until the app has finished starting.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          # Failing this restarts the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Failing this takes the pod out of the Service without restarting it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
