# The only way in from outside. /api goes to the controller and everything
# else to the static UI. Nothing in sandbox, and no admin port, is routed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground
  namespace: platform
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: controller
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
