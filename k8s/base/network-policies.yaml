# Sandbox pods start with no network access at all; each policy below opens
# one specific path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Who may call the target's public port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-http
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: target
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: loadgen
      ports:
        - protocol: TCP
          port: 8080
---
# Prometheus collects metrics from the target and the load generator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-scrape
  namespace: sandbox
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [target, loadgen]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9100
---
# The admin port takes fault toggles. Only the controller may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-admin
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: target
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: controller
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loadgen-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: loadgen
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: target
      ports:
        - protocol: TCP
          port: 8080
---
# Platform pods take no traffic by default. Only the ingress controller may
# reach the controller and the web UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [controller, web]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The controller reads history from Prometheus, and canary analysis in
# argo-rollouts queries it too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-query
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
      ports:
        - protocol: TCP
          port: 9090
