apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: platform
---
# Everything the controller may do, and all of it is inside sandbox. This is a
# Role, not a ClusterRole: the controller has no rights in any other namespace
# and none at cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: sandbox
rules:
  # Read-only view of the pods and what is happening to them.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Shows which pods the Service is actually routing to.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # The one write: changing the target Rollout's image for the bad-deploy
  # fault, and setting it back afterwards.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    resourceNames: ["target"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: platform
