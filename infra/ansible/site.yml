---
- name: Harden the server, install k3s and the add-ons
  hosts: server
  become: true
  vars:
    cloudflare_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
  pre_tasks:
    - name: Require the Cloudflare API token
      ansible.builtin.assert:
        that: cloudflare_api_token | length > 0
        fail_msg: CLOUDFLARE_API_TOKEN is empty. Set it in your shell before running site.
        quiet: true
      no_log: true
      tags: [always]
  roles:
    - base
    - k3s
    - addons
