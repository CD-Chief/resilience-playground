[defaults]
roles_path = roles
# Host keys are checked; unknown hosts are recorded on first contact.
host_key_checking = True
private_key_file = ~/.ssh/id
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/work/infra/ansible/.known_hosts
