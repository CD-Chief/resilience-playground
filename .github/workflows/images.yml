name: images

on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cd-chief/resilience-playground

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: target-v1
            app: target
            tag_prefix: v1-
            build_args: |
              VERSION=v1
          - name: target-v2-broken
            app: target
            tag_prefix: v2-broken-
            build_args: |
              VERSION=v2-broken
              BROKEN=true
          - name: target-v2-flaky
            app: target
            tag_prefix: v2-flaky-
            build_args: |
              VERSION=v2-flaky
              ERROR_RATE=0.5
          - name: loadgen
            app: loadgen
            extra_tag: main
          - name: controller
            app: controller
            extra_tag: main
          - name: web
            app: web
            extra_tag: main
    steps:
      - uses: actions/checkout@v7

      - name: Compute SHA7
        run: echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ matrix.tag_prefix }}${{ env.SHA7 }}
            ${{ matrix.extra_tag && format('{0}/{1}:{2}', env.REGISTRY, matrix.app, matrix.extra_tag) || '' }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/CD-Chief/resilience-playground

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "SHA7: \`${GITHUB_SHA::7}\`"
            echo
            echo "Deploy this build with:"
            echo
            echo '```'
            echo "scripts/set-image-tag.sh ${GITHUB_SHA::7}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
